[package]
name = "kvault-interface"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Instruction builders for Kamino Vault (kvault) — no anchor-lang dependency"
license = "Apache-2.0"

[dependencies]
solana-pubkey = { version = "2.1", features = ["borsh", "curve25519", "bytemuck"] }
solana-instruction = "2.1"
borsh = { version = "0.10.3", features = ["const-generics"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
sha2 = { version = "0.10", default-features = false }
spl-discriminator = "0.5"
fixed = "1.23.1"
klend-interface = "0.6.0"

[dev-dependencies]
litesvm = "0.7"
solana-sdk = "~2.3"
solana-client = "~2.3"
solana-account = "2.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
spl-token = "7"
spl-associated-token-account = "6"

[profile.ci]
inherits = "dev"
debug = false
incremental = false

[workspace]
